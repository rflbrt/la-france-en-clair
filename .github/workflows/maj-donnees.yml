name: Mise à jour des données

on:
  schedule:
    # Chaque lundi vers 12 h 15 ou 13 h 15 à Paris. Pas plus souvent : chaque enregistrement republie
    # le site sur Netlify (15 crédits sur 300 par mois en gratuit, site suspendu à zéro), et les
    # visiteurs lisent de toute façon les chiffres en direct.
    - cron: "17 11 * * 1"
  workflow_dispatch: # Permet aussi de le lancer à la main depuis l'onglet Actions

permissions:
  contents: write

jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Lire l'Insee et Eurostat
        run: python3 scripts/maj_donnees.py .
      - name: Mettre à jour les pages par chiffre
        # Si cette étape échoue, les nouvelles données sont quand même enregistrées.
        continue-on-error: true
        run: python3 scripts/pages_build.py .
      - name: Enregistrer si les chiffres ont changé
        run: |
          git add data.js index.html chiffres sitemap.xml
          if git diff --cached --quiet; then echo "Rien à enregistrer."; exit 0; fi
          git config user.name "maj-donnees[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Données : mise à jour du $(TZ=Europe/Paris date +%F)"
          git push
